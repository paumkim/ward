[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ward"
version = "1.0.0"
description = "Single-host defence against being sold as a residential proxy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pau Kim" }]
keywords = ["security", "nftables", "proxy", "residential-proxy", "socks5", "forensics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: System :: Monitoring",
]
# Intentionally empty: the whole point is that a defender must not need a
# package index to start on a machine that is under attack.
dependencies = []

[project.scripts]
ward = "ward.cli:main"

[project.urls]
Homepage = "https://github.com/paumkim/ward"
Issues = "https://github.com/paumkim/ward/issues"

[tool.setuptools]
packages = ["ward"]